<html>
<head>

<title>Responsive Webpage</title>
<style>
body{
font-family: Arial;
margin: 0;
}

header{
background-color: green;
color: white;
padding: 15px;
text-align: centre;
}

nav{
display: flex;
justify-content: center;
background-color: red;
flex-wrap: wrap;
}

nav a {
padding: 14px 20px;
text-decoration: none;
color: white;
}

nav a:hover{
background-color: purple;
}

.container{
padding: 20px;
display: grid;
grid-template-columns: repeat(auto-fit,minmax(250px, 1fr))
gap: 20px;
}

.card{
background: yellow;
padding: 20px;
border-radius: 8px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

footer{
background: blue;
color: white;
text-align: center;
padding: 10px;
}
</style>
</head>
<body>
<header>
<h1>Responsive Webpage </h1>
</header>
<nav>
<a href="one.html">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>

<div class="container">
<div class="card">Card 1 </div>
<div class="card">Card 2 </div>
<div class="card">Card 3 </div>
</div>

<footer>
<p>&copy: Responsive Page Example</p>
</footer>
</body>
